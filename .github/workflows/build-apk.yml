name: Build Ektogit APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Foss debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out this fork
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: ./gradlew assembleFossDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ektogit-phone-debug
          path: app/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error
          retention-days: 14
