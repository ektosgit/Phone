name: Build Ektogit APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Ektogit release APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out this fork
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: ./gradlew assembleFossRelease --no-daemon

      - name: Sign APK
        run: |
          SIGNING_PASSWORD="$(openssl rand -base64 32)"
          keytool -genkeypair -v \
            -keystore ektogit.keystore \
            -storetype JKS \
            -alias ektogit \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$SIGNING_PASSWORD" \
            -keypass "$SIGNING_PASSWORD" \
            -dname "CN=Ektogit, O=Ektogit, C=XX"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks ektogit.keystore \
            --ks-type JKS \
            --ks-key-alias ektogit \
            --ks-pass pass:"$SIGNING_PASSWORD" \
            --key-pass pass:"$SIGNING_PASSWORD" \
            --out app/build/outputs/apk/foss/release/phone-ektogit-release.apk \
            app/build/outputs/apk/foss/release/*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ektogit-phone-release
          path: app/build/outputs/apk/foss/release/phone-ektogit-release.apk
          if-no-files-found: error
          retention-days: 14
